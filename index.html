<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dungeon Omega — WebXR viewer</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="hud">
      <h1>Dungeon Omega</h1>
      <p id="status">Loading reconstruction…</p>
      <p class="help">Desktop: drag to look · scroll to zoom · <kbd>H</kbd> reset<br>Quest: left stick moves · right stick turns · A/X resets</p>
      <button id="home" type="button">Home / Reset</button>
    </main>
    <script type="module" src="viewer.js"></script>
  </body>
</html>
